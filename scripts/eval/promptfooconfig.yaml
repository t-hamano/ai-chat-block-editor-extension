# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Evaluates the AI assistant with a real model. See README.md in this folder.

# The version of the evaluation set, shown in `npm run eval:view`. Raise it
# when an existing case changes. See README.md.
description: AI assistant evaluation, eval set v1

# The case is in the variables. The prompt is only the label promptfoo shows.
prompts:
  - '{{request}}'

providers:
  - id: file://provider.mjs
    label: claude-sonnet-5-5
    config:
      model: claude-sonnet-5-5

evaluateOptions:
  # One case at a time, so the prompt cache is used the same way in every run.
  maxConcurrency: 1
  # The model does not answer the same way every time, so each case runs
  # three times, and `npm run eval:record` records the average.
  repeat: 3

defaultTest:
  assert:
    - type: javascript
      value: file://assertions.mjs:validMarkup
      metric: validMarkup
    - type: javascript
      value: file://assertions.mjs:firstTry
      metric: firstTry
    - type: javascript
      value: file://assertions.mjs:answered
      metric: answered
    - type: javascript
      value: file://assertions.mjs:usage
      weight: 0

tests:
  - description: Rewrite a short paragraph
    vars:
      request: Rewrite this paragraph to be shorter and friendlier.
      document: file://documents/short-article.html
      select:
        block: [1]
    assert:
      - type: javascript
        value: file://assertions.mjs:edited
        metric: edited
      - type: javascript
        value: file://assertions.mjs:expected
        metric: expected
        config:
          blocks: [core/paragraph]
          absent: [Nobody was sure it would work.]

  - description: Edit selected text
    vars:
      request: Change this to "twelve weeks".
      document: file://documents/short-article.html
      select:
        block: [1]
        text: three months
    assert:
      - type: javascript
        value: file://assertions.mjs:edited
        metric: edited
      - type: javascript
        value: file://assertions.mjs:expected
        metric: expected
        config:
          text: [twelve weeks, Last spring]
          absent: [three months]

  - description: Put selected blocks in columns
    vars:
      request: Put these two paragraphs side by side in two columns.
      document: file://documents/plans-table.html
      select:
        block: [1]
        to: [2]
    assert:
      - type: javascript
        value: file://assertions.mjs:edited
        metric: edited
      - type: javascript
        value: file://assertions.mjs:expected
        metric: expected
        config:
          blocks: [core/columns, core/column]
          text: [Basic plan, Pro plan]

  - description: Add blocks without a selection
    vars:
      request: Add a "Summary" heading and a two-sentence summary at the end.
      document: file://documents/short-article.html
    assert:
      - type: javascript
        value: file://assertions.mjs:edited
        metric: edited
      - type: javascript
        value: file://assertions.mjs:expected
        metric: expected
        config:
          # The summary is a paragraph after the heading.
          order: ['>Summary</h', '<!-- wp:paragraph']

  - description: Edit a long document sent as an outline
    vars:
      request: In the section about tomatoes, add a short paragraph with tips on mulching after the paragraph about watering.
      document: file://documents/long-guide.html
    assert:
      - type: javascript
        value: file://assertions.mjs:edited
        metric: edited
      - type: javascript
        value: file://assertions.mjs:expected
        metric: expected
        config:
          # The new paragraph goes after the watering paragraph of the tomatoes section.
          order: [Water tomatoes deeply, mulch, Harvesting tomatoes]

  - description: Follow up in a second turn
    vars:
      request: Turn this into a bulleted list.
      followUp: Add one more item to the list, a headlamp.
      document: file://documents/list.html
      select:
        block: [1]
    assert:
      - type: javascript
        value: file://assertions.mjs:edited
        metric: edited
      - type: javascript
        value: file://assertions.mjs:expected
        metric: expected
        config:
          blocks: [core/list, core/list-item]
          text: [headlamp, rain jacket]

  - description: Edit blocks the model added in the turn before
    vars:
      request: Add three short paragraphs at the end, each with one tip for teams trying a four-day week.
      followUp: Make the first of the paragraphs you just added start with "Start small:".
      document: file://documents/short-article.html
    assert:
      - type: javascript
        value: file://assertions.mjs:edited
        metric: edited
      - type: javascript
        value: file://assertions.mjs:expected
        metric: expected
        config:
          # The edited paragraph is the first of the three added after the last
          # paragraph: two more paragraphs follow it.
          order:
            [review it again next year, 'Start small:', '<!-- wp:paragraph', '<!-- wp:paragraph']
          # The four paragraphs and the three added, so the follow-up edited one
          # of them rather than adding another.
          count: { '<!-- wp:paragraph': 7, 'Start small:': 1 }

  - description: Use the theme's presets for colors and font size
    vars:
      request: Make this paragraph stand out with the Accent 3 background, Base text, and the Large font size.
      document: file://documents/short-article.html
      select:
        block: [1]
    assert:
      - type: javascript
        value: file://assertions.mjs:edited
        metric: edited
      - type: javascript
        value: file://assertions.mjs:expected
        metric: expected
        config:
          # The presets by their slugs, with the classes they add, and no
          # fixed values instead of them.
          text:
            [
              '"backgroundColor":"accent-3"',
              '"textColor":"base"',
              '"fontSize":"large"',
              has-accent-3-background-color,
              has-base-color,
              has-large-font-size,
              Last spring,
            ]
          absent: ['#503AA8', '#FFFFFF', 'font-size:']
